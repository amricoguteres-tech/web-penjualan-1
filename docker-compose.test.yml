services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nebula_test
      POSTGRES_PASSWORD: nebula_test_only
      POSTGRES_DB: nebula_x_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula_test -d nebula_x_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - nebula_test_postgres:/var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  smtp-test:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"

  s3-test:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: nebula-test-access
      MINIO_ROOT_PASSWORD: nebula-test-secret
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - nebula_test_s3:/data

volumes:
  nebula_test_postgres:
  nebula_test_s3:
